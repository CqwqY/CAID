<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>CAID 副驾 · 设置</title>
  <style>
    body { font: 14px/1.6 sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 18px; }
    label { display: block; margin: 14px 0 4px; font-weight: 500; }
    input[type=text], input[type=password] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 14px 0; }
    button { background: #185FA5; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .hint { color: #666; font-size: 12px; }
    #status { margin-top: 12px; color: #0F6E56; min-height: 18px; }
  </style>
</head>
<body>
  <h1>CAID 副驾 · LLM 设置</h1>
  <p class="hint">配置副驾调用的大模型。默认走 DashScope 免费代理；也可填自己的 OpenAI / 兼容端点。</p>

  <div class="row">
    <input type="checkbox" id="useFree" checked />
    <label for="useFree" style="margin:0">使用 DashScope 免费代理（qwen3.5-plus）</label>
  </div>

  <label>模型 (model)</label>
  <input type="text" id="model" placeholder="qwen3.5-plus" />

  <label>Base URL</label>
  <input type="text" id="baseUrl" placeholder="https://..." />

  <label>API Key</label>
  <input type="password" id="apiKey" placeholder="留空则用免费代理默认值" />

  <button id="save">保存</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
