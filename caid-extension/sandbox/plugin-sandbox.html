<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAID Plugin Sandbox</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #cdd3e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      line-height: 1.6;
    }
    body { padding: 6px 8px; }
    .plugin-row { padding: 6px 2px; color: #cdd3e0; }
    .plugin-row.muted { color: #8a93a6; font-size: 12px; }
    .plugin-err { color: #ff6b6b; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    a { color: #6ea8fe; }
    button {
      font: inherit;
      background: #1b2735; color: #cdd3e0;
      border: 1px solid #2a3a4d; border-radius: 6px;
      padding: 4px 10px; cursor: pointer;
    }
    button:hover { background: #243349; }
  </style>
</head>
<body>
  <div id="pluginRoot"></div>
  <script src="plugin-sandbox.js"></script>
</body>
</html>
